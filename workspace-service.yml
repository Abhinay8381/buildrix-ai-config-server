server:
  port: 9020
  servlet.context-path: /workspace

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/buildrix-workspace-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects
  starter-project-bucket: starter-projects
  react-vite-tailwind-daisyui-starter: react-vite-tailwind-daisyui-starter

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.buildrix-core.svc.cluster.local:5432/workspace_db
    username: workspace_user
    password: ${DB_PASSWORD}
  data:
    redis:
      host: redis.buildrix-core.svc.cluster.local
      port: 6379

minio:
  url: http://minio.buildrix-core.svc.cluster.local:9000
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}