server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/buildrix-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  ai:
    openai:
      base-url: https://openrouter.ai/api/v1
      chat:
        temperature: 0.0
        #model: google/gemma-4-26b-a4b-it:free
        #model: x-ai/grok-code-fast-1
        model: openai/gpt-5.6-luna
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

---

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.buildrix-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
  ai:
    openai:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-5.6-luna}