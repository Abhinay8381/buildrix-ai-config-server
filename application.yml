spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  threads:
    virtual:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    hostname: localhost

jwt.secretKey: asfd9asfdaoijfalkjl23u4oi5jlkjf98790890890ugojvakglsdfjn8yuh

app:
  frontend:
    url: http://localhost:8080/frontend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN
